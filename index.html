<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FreshTrack</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,400&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@zxing/library@0.19.1/umd/index.min.js"></script>
<style>
:root {
  --bg: #F7F4EF;
  --surface: #FFFFFF;
  --surface2: #F0EDE7;
  --text: #1C1A16;
  --text2: #6B6760;
  --text3: #A8A49E;
  --border: #E2DDD6;
  --green: #3A7D5B;
  --green-bg: #EBF5EF;
  --green-text: #2A5E43;
  --amber: #B87316;
  --amber-bg: #FDF3E2;
  --amber-text: #8A5510;
  --red: #C0392B;
  --red-bg: #FDECEA;
  --red-text: #8B1A10;
  --radius: 14px;
  --radius-sm: 8px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

/* HEADER */
header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0 28px;
  height: 62px;
  display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; z-index: 200;
}
.logo { font-family: 'Playfair Display', serif; font-size: 22px; font-weight: 600; letter-spacing: -0.3px; }
.logo em { color: var(--green); font-style: normal; }
.header-right { display: flex; gap: 10px; align-items: center; }

/* BUTTONS */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 16px; border-radius: var(--radius-sm);
  font-family: inherit; font-size: 14px; font-weight: 500;
  cursor: pointer; border: 1.5px solid transparent; transition: all .15s;
}
.btn-primary { background: var(--green); color: #fff; border-color: var(--green); }
.btn-primary:hover { background: var(--green-text); border-color: var(--green-text); }
.btn-outline { background: transparent; color: var(--text); border-color: var(--border); }
.btn-outline:hover { background: var(--surface2); }
.btn-ghost { background: transparent; color: var(--text2); border-color: transparent; padding: 8px 10px; }
.btn-ghost:hover { background: var(--surface2); color: var(--text); }
.btn-danger { background: var(--red-bg); color: var(--red-text); border-color: transparent; }
.btn-danger:hover { background: #fbd5d2; }
.btn-sm { padding: 5px 10px; font-size: 13px; border-radius: 6px; }
.btn-icon { width: 36px; height: 36px; padding: 0; justify-content: center; border-radius: var(--radius-sm); }

/* LAYOUT */
.main { max-width: 960px; margin: 0 auto; padding: 28px 24px; }

/* STATS BAR */
.stats-bar {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 28px;
}
.stat-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 18px 20px;
}
.stat-card .label { font-size: 12px; font-weight: 500; color: var(--text3); text-transform: uppercase; letter-spacing: .6px; margin-bottom: 8px; }
.stat-card .value { font-family: 'Playfair Display', serif; font-size: 28px; font-weight: 600; line-height: 1; }
.stat-card.red .value { color: var(--red); }
.stat-card.amber .value { color: var(--amber); }
.stat-card.green .value { color: var(--green); }

/* TOOLBAR */
.toolbar {
  display: flex; gap: 10px; align-items: center; margin-bottom: 18px; flex-wrap: wrap;
}
.search-wrap { position: relative; flex: 1; min-width: 180px; }
.search-wrap input {
  width: 100%; padding: 9px 14px 9px 38px;
  border: 1.5px solid var(--border); border-radius: var(--radius-sm);
  font-family: inherit; font-size: 14px; background: var(--surface);
  color: var(--text); outline: none; transition: border .15s;
}
.search-wrap input:focus { border-color: var(--green); }
.search-wrap .icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text3); font-size: 16px; pointer-events: none; }
.filter-tabs { display: flex; gap: 4px; background: var(--surface2); border-radius: var(--radius-sm); padding: 4px; }
.filter-tab {
  padding: 6px 14px; border-radius: 6px; font-size: 13px; font-weight: 500;
  cursor: pointer; border: none; background: transparent; color: var(--text2);
  transition: all .15s; font-family: inherit;
}
.filter-tab.active { background: var(--surface); color: var(--text); box-shadow: 0 1px 4px rgba(0,0,0,.08); }

/* PRODUCT LIST */
.section-title {
  font-family: 'Playfair Display', serif; font-size: 17px; font-weight: 600;
  margin-bottom: 12px; color: var(--text2);
}
.products-grid { display: flex; flex-direction: column; gap: 8px; margin-bottom: 28px; }

.product-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 16px 20px;
  display: flex; align-items: center; gap: 16px;
  transition: box-shadow .15s;
  animation: fadeIn .2s ease;
}
.product-card:hover { box-shadow: 0 2px 12px rgba(0,0,0,.06); }
@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

.product-card .dot {
  width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0;
}
.dot-green { background: var(--green); }
.dot-amber { background: var(--amber); }
.dot-red { background: var(--red); }
.dot-gray { background: var(--text3); }

.product-info { flex: 1; min-width: 0; }
.product-name { font-weight: 500; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.product-meta { font-size: 13px; color: var(--text3); margin-top: 2px; }

.product-badge {
  padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 500;
  white-space: nowrap; flex-shrink: 0;
}
.badge-green { background: var(--green-bg); color: var(--green-text); }
.badge-amber { background: var(--amber-bg); color: var(--amber-text); }
.badge-red { background: var(--red-bg); color: var(--red-text); }
.badge-gray { background: var(--surface2); color: var(--text3); }

.product-actions { display: flex; gap: 6px; flex-shrink: 0; }

.empty-state {
  text-align: center; padding: 56px 20px; color: var(--text3);
}
.empty-state .icon { font-size: 40px; margin-bottom: 12px; }
.empty-state p { font-size: 15px; }
.empty-state small { font-size: 13px; display: block; margin-top: 6px; }

/* MODAL */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(28,26,22,.45);
  display: flex; align-items: center; justify-content: center;
  z-index: 500; padding: 20px;
  animation: fadeOverlay .15s ease;
}
.modal-overlay.hidden { display: none; }
@keyframes fadeOverlay { from { opacity: 0; } to { opacity: 1; } }

.modal {
  background: var(--surface); border-radius: 18px;
  width: 100%; max-width: 480px;
  padding: 28px; box-shadow: 0 8px 40px rgba(0,0,0,.18);
  animation: slideUp .18s ease;
}
@keyframes slideUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }

.modal-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 24px;
}
.modal-title { font-family: 'Playfair Display', serif; font-size: 20px; font-weight: 600; }

.form-group { margin-bottom: 18px; }
.form-label { display: block; font-size: 13px; font-weight: 500; color: var(--text2); margin-bottom: 6px; }
.form-input {
  width: 100%; padding: 10px 14px;
  border: 1.5px solid var(--border); border-radius: var(--radius-sm);
  font-family: inherit; font-size: 15px; color: var(--text);
  background: var(--surface); outline: none; transition: border .15s;
}
.form-input:focus { border-color: var(--green); }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

.form-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 24px; }

/* BARCODE MODAL */
#barcode-reader-wrap {
  width: 100%; border-radius: var(--radius-sm); overflow: hidden;
  background: #000; position: relative; margin-bottom: 14px;
}
#barcode-reader-wrap video { width: 100%; display: block; border-radius: var(--radius-sm); }
.scan-overlay {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  pointer-events: none;
}
.scan-frame {
  width: 220px; height: 120px; border: 2px solid rgba(255,255,255,.7);
  border-radius: 8px; position: relative;
}
.scan-frame::before, .scan-frame::after {
  content: ''; position: absolute; width: 20px; height: 20px;
  border-color: var(--green); border-style: solid;
}
.scan-frame::before { top: -2px; left: -2px; border-width: 3px 0 0 3px; }
.scan-frame::after { bottom: -2px; right: -2px; border-width: 0 3px 3px 0; }
.scan-status { font-size: 13px; color: var(--text2); text-align: center; margin-bottom: 12px; min-height: 20px; }

/* NOTIFICATION BANNER */
.notif-banner {
  position: fixed; bottom: 24px; right: 24px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 14px 18px;
  box-shadow: 0 4px 20px rgba(0,0,0,.12);
  max-width: 320px; z-index: 300;
  animation: slideIn .2s ease;
  display: flex; gap: 12px; align-items: flex-start;
}
.notif-banner.hidden { display: none; }
@keyframes slideIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: none; } }
.notif-banner .notif-icon { font-size: 20px; flex-shrink: 0; margin-top: 1px; }
.notif-banner .notif-text { flex: 1; }
.notif-banner .notif-title { font-weight: 500; font-size: 14px; margin-bottom: 2px; }
.notif-banner .notif-msg { font-size: 13px; color: var(--text2); }
.notif-close { background: none; border: none; cursor: pointer; color: var(--text3); font-size: 16px; padding: 0; line-height: 1; }

/* CATEGORY TAG */
.cat-tag {
  display: inline-block; font-size: 11px; font-weight: 500;
  padding: 2px 8px; border-radius: 20px;
  background: var(--surface2); color: var(--text3);
}

/* RESPONSIVE */
@media (max-width: 600px) {
  .stats-bar { grid-template-columns: repeat(2, 1fr); }
  .form-row { grid-template-columns: 1fr; }
  header { padding: 0 16px; }
  .main { padding: 20px 16px; }
}

/* SCROLLBAR */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

/* PROFILE SCREEN */
#profile-screen {
  min-height: 100vh; display: flex; align-items: center; justify-content: center;
  padding: 24px;
}
.profile-box {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 20px; padding: 36px 32px;
  width: 100%; max-width: 440px;
  box-shadow: 0 4px 32px rgba(0,0,0,.07);
}
.profile-logo {
  font-family: 'Playfair Display', serif; font-size: 26px; font-weight: 600;
  text-align: center; margin-bottom: 6px;
}
.profile-logo em { color: var(--green); font-style: normal; }
.profile-subtitle { text-align: center; font-size: 14px; color: var(--text3); margin-bottom: 28px; }

.profile-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
.profile-item {
  display: flex; align-items: center; gap: 14px;
  padding: 13px 16px; border-radius: var(--radius);
  border: 1.5px solid var(--border); background: var(--surface);
  cursor: pointer; transition: all .15s; font-family: inherit;
  text-align: left; width: 100%;
}
.profile-item:hover { border-color: var(--green); background: var(--green-bg); }
.profile-avatar {
  width: 40px; height: 40px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; flex-shrink: 0; font-weight: 600;
  font-family: 'Playfair Display', serif;
}
.profile-item-info { flex: 1; min-width: 0; }
.profile-item-name { font-size: 15px; font-weight: 500; color: var(--text); }
.profile-item-count { font-size: 12px; color: var(--text3); margin-top: 1px; }
.profile-item-delete {
  background: none; border: none; cursor: pointer; color: var(--text3);
  font-size: 15px; padding: 4px; border-radius: 6px; line-height: 1;
  transition: all .15s; flex-shrink: 0;
}
.profile-item-delete:hover { background: var(--red-bg); color: var(--red-text); }

.profile-divider {
  display: flex; align-items: center; gap: 10px;
  font-size: 12px; color: var(--text3); margin-bottom: 16px;
}
.profile-divider::before, .profile-divider::after {
  content: ''; flex: 1; height: 1px; background: var(--border);
}

.new-profile-row { display: flex; gap: 8px; }
.new-profile-row input { flex: 1; }

/* Avatar colors */
.av-0 { background: #EBF5EF; color: var(--green-text); }
.av-1 { background: #EEF2FF; color: #3730a3; }
.av-2 { background: #FDF3E2; color: var(--amber-text); }
.av-3 { background: #FDECEA; color: var(--red-text); }
.av-4 { background: #F0F9FF; color: #0369a1; }
.av-5 { background: #FDF4FF; color: #7e22ce; }
.av-6 { background: #F0FDF4; color: #166534; }
.av-7 { background: #FFF7ED; color: #9a3412; }

/* Active profile pill in header */
.profile-pill {
  display: flex; align-items: center; gap: 7px;
  padding: 5px 10px 5px 6px; border-radius: 20px;
  border: 1.5px solid var(--border); background: var(--surface);
  cursor: pointer; font-family: inherit; font-size: 13px; font-weight: 500;
  color: var(--text); transition: all .15s;
}
.profile-pill:hover { border-color: var(--green); background: var(--green-bg); }
.profile-pill .mini-av {
  width: 24px; height: 24px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 600; flex-shrink: 0;
}
</style>
</head>
<body>

<!-- PROFILE SELECTION SCREEN -->
<div id="profile-screen">
  <div class="profile-box">
    <div class="profile-logo">Fresh<em>Track</em></div>
    <div class="profile-subtitle">Scegli il tuo profilo per continuare</div>

    <div class="profile-list" id="profile-list"></div>

    <div class="profile-divider">oppure crea nuovo</div>

    <div class="new-profile-row">
      <input type="text" class="form-input" id="new-profile-name" placeholder="Il tuo nome…" maxlength="24">
      <button class="btn btn-primary" id="create-profile-btn">Crea</button>
    </div>
  </div>
</div>

<!-- APP (nascosta finché non si sceglie profilo) -->
<div id="app-screen" style="display:none">

<!-- HEADER -->
<header>
  <div class="logo">Fresh<em>Track</em></div>
  <div class="header-right">
    <button class="profile-pill" id="profile-switcher-btn" title="Cambia profilo">
      <span class="mini-av" id="header-mini-av"></span>
      <span id="header-profile-name"></span>
    </button>
    <button class="btn btn-ghost btn-icon" id="notif-btn" title="Attiva notifiche">🔔</button>

    <button class="btn btn-primary" id="add-btn">+ Aggiungi</button>
  </div>
</header>

<!-- MAIN -->
<div class="main">

  <!-- STATS -->
  <div class="stats-bar">
    <div class="stat-card red">
      <div class="label">Scaduti / oggi</div>
      <div class="value" id="stat-expired">0</div>
    </div>
    <div class="stat-card amber">
      <div class="label">In scadenza (7gg)</div>
      <div class="value" id="stat-soon">0</div>
    </div>
    <div class="stat-card green">
      <div class="label">Freschi</div>
      <div class="value" id="stat-fresh">0</div>
    </div>
    <div class="stat-card">
      <div class="label">Totale prodotti</div>
      <div class="value" id="stat-total">0</div>
    </div>
  </div>

  <!-- TOOLBAR -->
  <div class="toolbar">
    <div class="search-wrap">
      <span class="icon">🔍</span>

    <div class="filter-tabs">
      <button class="filter-tab active" data-filter="all">Tutti</button>
      <button class="filter-tab" data-filter="expired">Scaduti</button>

      <button class="filter-tab" data-filter="fresh">Freschi</button>
    </div>
  </div>

  <!-- LIST -->
  <div id="products-list"></div>
</div>

<!-- MODAL AGGIUNTA MANUALE -->
<div class="modal-overlay hidden" id="add-modal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="modal-title">Aggiungi prodotto</div>
      <button class="btn btn-ghost btn-icon" id="close-add-modal">✕</button>
    </div>
    <input type="hidden" id="edit-id">
    <div class="form-group">
      <label class="form-label">Nome prodotto *</label>

        <label class="form-label">Data di scadenza *</label>

      <div class="form-group">
        <label class="form-label">Categoria</label>
        <select class="form-input" id="input-category">
          <option value="Latticini">🥛 Latticini</option>
          <option value="Carne">🥩 Carne</option>

          <option value="Verdura">🥦 Verdura</option>

          <option value="Bevande">🧃 Bevande</option>

          <option value="Altro" selected>📦 Altro</option>

    </div>
    <div class="form-group">
      <label class="form-label">Note (opzionale)</label>

    <div class="form-actions">
      <button class="btn btn-outline" id="cancel-add">Annulla</button>
      <button class="btn btn-primary" id="save-product">Salva prodotto</button>
    </div>
  </div>
</div>

<!-- MODAL BARCODE -->
<div class="modal-overlay hidden" id="scan-modal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">Scansiona barcode</div>
      <button class="btn btn-ghost btn-icon" id="close-scan-modal">✕</button>
    </div>
    <div id="barcode-reader-wrap">
      <video id="scan-video" autoplay playsinline muted></video>
      <div class="scan-overlay"><div class="scan-frame"></div></div>
    </div>
    <div class="scan-status" id="scan-status">Punta la fotocamera sul codice a barre</div>
    <div id="scan-result-area" style="display:none">
      <div class="form-group">
        <label class="form-label">Codice rilevato</label>
        <input type="text" class="form-input" id="scan-code-display" readonly>
      </div>
      <div class="form-group">
        <label class="form-label">Nome prodotto *</label>
        <input type="text" class="form-input" id="scan-name" placeholder="Inserisci nome prodotto">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Data di scadenza *</label>
          <input type="date" class="form-input" id="scan-date">
        </div>
        <div class="form-group">
          <label class="form-label">Categoria</label>
          <select class="form-input" id="scan-category">
            <option value="Latticini">🥛 Latticini</option>
            <option value="Carne">🥩 Carne</option>
            <option value="Pesce">🐟 Pesce</option>
            <option value="Frutta">🍎 Frutta</option>
            <option value="Verdura">🥦 Verdura</option>
            <option value="Pane">🍞 Pane</option>
            <option value="Bevande">🧃 Bevande</option>
            <option value="Conserve">🥫 Conserve</option>
            <option value="Surgelati">🧊 Surgelati</option>
            <option value="Altro" selected>📦 Altro</option>
          </select>
        </div>
      </div>
      <div class="form-actions">
        <button class="btn btn-outline" id="scan-retry">↺ Riscan</button>
        <button class="btn btn-primary" id="scan-save">Salva prodotto</button>
      </div>
    </div>
  </div>
</div>

<!-- NOTIFICATION BANNER -->
<div class="notif-banner hidden" id="notif-banner">
  <div class="notif-icon">⚠️</div>
  <div class="notif-text">
    <div class="notif-title" id="notif-title">Attenzione</div>
    <div class="notif-msg" id="notif-msg"></div>
  </div>
  <button class="notif-close" id="notif-close-btn">✕</button>
</div>

</div><!-- /app-screen -->

<script>
// ── PROFILES ──────────────────────────────────────────────────────
const AV_COLORS = ['av-0','av-1','av-2','av-3','av-4','av-5','av-6','av-7'];

function getProfiles() {
  return JSON.parse(localStorage.getItem('freshtrack_profiles') || '[]');
}
function saveProfiles(arr) {
  localStorage.setItem('freshtrack_profiles', JSON.stringify(arr));
}
function getActiveProfile() {
  return localStorage.getItem('freshtrack_active_profile') || null;
}
function setActiveProfile(id) {
  localStorage.setItem('freshtrack_active_profile', id);
}

function profileStorageKey(id) {
  return 'freshtrack_products_' + id;
}

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2);
}

// Migrate old data to a default profile if needed
(function migrate() {
  const old = localStorage.getItem('freshtrack_products');
  if (old && old !== '[]') {
    const profiles = getProfiles();
    if (profiles.length === 0) {
      const id = uid();
      profiles.push({ id, name: 'Io', avatarColor: 'av-0', createdAt: new Date().toISOString() });
      saveProfiles(profiles);
      localStorage.setItem(profileStorageKey(id), old);
      localStorage.removeItem('freshtrack_products');
    }
  }
})();

function renderProfileScreen() {
  const profiles = getProfiles();
  const list = document.getElementById('profile-list');

  if (profiles.length === 0) {
    list.innerHTML = '<div style="text-align:center;color:var(--text3);font-size:14px;padding:8px 0">Nessun profilo ancora — creane uno!</div>';
    return;
  }

  list.innerHTML = profiles.map(p => {
    const prods = JSON.parse(localStorage.getItem(profileStorageKey(p.id)) || '[]');
    const initial = p.name.charAt(0).toUpperCase();
    return `
    <button class="profile-item" onclick="selectProfile('${p.id}')">
      <div class="profile-avatar ${p.avatarColor}">${initial}</div>
      <div class="profile-item-info">
        <div class="profile-item-name">${escHtml(p.name)}</div>
        <div class="profile-item-count">${prods.length} prodott${prods.length === 1 ? 'o' : 'i'}</div>
      </div>
      <button class="profile-item-delete" onclick="deleteProfile(event,'${p.id}')" title="Elimina profilo">✕</button>
    </button>`;
  }).join('');
}

window.selectProfile = function(id) {
  setActiveProfile(id);
  loadApp();
};

window.deleteProfile = function(e, id) {
  e.stopPropagation();
  const profiles = getProfiles();
  const p = profiles.find(x => x.id === id);
  if (!p) return;
  const prods = JSON.parse(localStorage.getItem(profileStorageKey(id)) || '[]');
  const msg = prods.length > 0
    ? `Eliminare il profilo "${p.name}" e i suoi ${prods.length} prodotti?`
    : `Eliminare il profilo "${p.name}"?`;
  if (!confirm(msg)) return;
  saveProfiles(profiles.filter(x => x.id !== id));
  localStorage.removeItem(profileStorageKey(id));
  if (getActiveProfile() === id) localStorage.removeItem('freshtrack_active_profile');
  renderProfileScreen();
};

document.getElementById('create-profile-btn').addEventListener('click', createProfile);
document.getElementById('new-profile-name').addEventListener('keydown', e => { if (e.key === 'Enter') createProfile(); });

function createProfile() {
  const input = document.getElementById('new-profile-name');
  const name = input.value.trim();
  if (!name) { input.focus(); return; }
  const profiles = getProfiles();
  const colorIdx = profiles.length % AV_COLORS.length;
  const id = uid();
  profiles.push({ id, name, avatarColor: AV_COLORS[colorIdx], createdAt: new Date().toISOString() });
  saveProfiles(profiles);
  input.value = '';
  selectProfile(id);
}

function showProfileScreen() {
  document.getElementById('profile-screen').style.display = 'flex';
  document.getElementById('app-screen').style.display = 'none';
  renderProfileScreen();
}

function loadApp() {
  const id = getActiveProfile();
  if (!id) { showProfileScreen(); return; }
  const profiles = getProfiles();
  const profile = profiles.find(p => p.id === id);
  if (!profile) { showProfileScreen(); return; }

  // Update header
  const initial = profile.name.charAt(0).toUpperCase();
  document.getElementById('header-mini-av').textContent = initial;
  document.getElementById('header-mini-av').className = 'mini-av ' + profile.avatarColor;
  document.getElementById('header-profile-name').textContent = profile.name;

  document.getElementById('profile-screen').style.display = 'none';
  document.getElementById('app-screen').style.display = 'block';

  // Load this profile's products
  products = JSON.parse(localStorage.getItem(profileStorageKey(id)) || '[]');
  render();
}

document.getElementById('profile-switcher-btn').addEventListener('click', showProfileScreen);

// ── DATA ──────────────────────────────────────────────────────────
let products = [];
let currentFilter = 'all';
let searchQuery = '';
let editingId = null;

function save() {
  const id = getActiveProfile();
  if (id) localStorage.setItem(profileStorageKey(id), JSON.stringify(products));
}

// uid already defined above

// ── DATE UTILS ────────────────────────────────────────────────────
function today() {
  const d = new Date(); d.setHours(0,0,0,0); return d;
}

function parseDate(str) {
  const [y,m,d] = str.split('-').map(Number);
  return new Date(y, m-1, d);
}

function daysLeft(dateStr) {
  const diff = parseDate(dateStr) - today();
  return Math.ceil(diff / 86400000);
}

function statusOf(p) {
  const d = daysLeft(p.expiry);
  if (d < 0) return 'expired';
  if (d <= 7) return 'soon';
  return 'fresh';
}

function badgeLabel(p) {
  const d = daysLeft(p.expiry);
  if (d < 0) return `Scaduto ${Math.abs(d)}gg fa`;
  if (d === 0) return 'Scade oggi!';
  if (d === 1) return 'Scade domani';
  if (d <= 7) return `Scade in ${d}gg`;
  return `${d} giorni`;
}

function badgeClass(status) {
  return {expired:'badge-red', soon:'badge-amber', fresh:'badge-green'}[status] || 'badge-gray';
}
function dotClass(status) {
  return {expired:'dot-red', soon:'dot-amber', fresh:'dot-green'}[status] || 'dot-gray';
}

// ── RENDER ────────────────────────────────────────────────────────
function render() {
  let list = [...products];

  // filter
  if (currentFilter !== 'all') list = list.filter(p => statusOf(p) === currentFilter);
  if (searchQuery) list = list.filter(p => p.name.toLowerCase().includes(searchQuery.toLowerCase()));

  // sort: expired first, then by days
  list.sort((a,b) => daysLeft(a.expiry) - daysLeft(b.expiry));

  // stats (always on full products)
  const expired = products.filter(p => statusOf(p) === 'expired').length;
  const soon    = products.filter(p => statusOf(p) === 'soon').length;
  const fresh   = products.filter(p => statusOf(p) === 'fresh').length;
  document.getElementById('stat-expired').textContent = expired;
  document.getElementById('stat-soon').textContent    = soon;
  document.getElementById('stat-fresh').textContent   = fresh;
  document.getElementById('stat-total').textContent   = products.length;

  const container = document.getElementById('products-list');

  if (list.length === 0) {
    container.innerHTML = `<div class="empty-state">
      <div class="icon">🛒</div>
      <p>${products.length === 0 ? 'Nessun prodotto ancora.' : 'Nessun risultato.'}</p>
      <small>${products.length === 0 ? 'Aggiungi il tuo primo prodotto con il tasto + Aggiungi.' : 'Prova a cambiare filtro o ricerca.'}</small>
    </div>`;
    return;
  }

  // group by status label
  const groups = [
    { key: 'expired', label: '⚠️ Scaduti o in scadenza oggi' },
    { key: 'soon',    label: '🕐 In scadenza (entro 7 giorni)' },
    { key: 'fresh',   label: '✅ Freschi' },
  ];

  let html = '';
  for (const g of groups) {
    const items = list.filter(p => statusOf(p) === g.key);
    if (!items.length) continue;
    html += `<div class="section-title">${g.label}</div><div class="products-grid">`;
    for (const p of items) {
      const st = statusOf(p);
      html += `
      <div class="product-card" data-id="${p.id}">
        <div class="dot ${dotClass(st)}"></div>
        <div class="product-info">
          <div class="product-name">${escHtml(p.name)}</div>
          <div class="product-meta">
            <span class="cat-tag">${escHtml(p.category)}</span>
            ${p.notes ? ' · ' + escHtml(p.notes) : ''}
            · Scadenza: ${formatDate(p.expiry)}
          </div>
        </div>
        <span class="product-badge ${badgeClass(st)}">${badgeLabel(p)}</span>
        <div class="product-actions">
          <button class="btn btn-ghost btn-sm btn-icon" onclick="editProduct('${p.id}')" title="Modifica">✏️</button>
          <button class="btn btn-danger btn-sm btn-icon" onclick="deleteProduct('${p.id}')" title="Elimina">🗑</button>
        </div>
      </div>`;
    }
    html += '</div>';
  }
  container.innerHTML = html;
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function formatDate(str) {
  const [y,m,d] = str.split('-');
  return `${d}/${m}/${y}`;
}

// ── ADD / EDIT / DELETE ───────────────────────────────────────────
function openAddModal(prefill = {}) {
  editingId = prefill.id || null;
  document.getElementById('modal-title').textContent = editingId ? 'Modifica prodotto' : 'Aggiungi prodotto';
  document.getElementById('input-name').value     = prefill.name     || '';
  document.getElementById('input-date').value     = prefill.expiry   || '';
  document.getElementById('input-notes').value    = prefill.notes    || '';
  document.getElementById('input-category').value = prefill.category || 'Altro';
  document.getElementById('add-modal').classList.remove('hidden');
  setTimeout(() => document.getElementById('input-name').focus(), 50);
}

function closeAddModal() {
  document.getElementById('add-modal').classList.add('hidden');
  editingId = null;
}

function saveProduct() {
  const name     = document.getElementById('input-name').value.trim();
  const expiry   = document.getElementById('input-date').value;
  const category = document.getElementById('input-category').value;
  const notes    = document.getElementById('input-notes').value.trim();

  if (!name || !expiry) { showBanner('warning','Campi mancanti','Inserisci nome e data di scadenza.'); return; }

  if (editingId) {
    const idx = products.findIndex(p => p.id === editingId);
    if (idx > -1) products[idx] = { ...products[idx], name, expiry, category, notes };
  } else {
    products.push({ id: uid(), name, expiry, category, notes, addedOn: new Date().toISOString() });
  }
  save(); closeAddModal(); render();
}

window.editProduct = function(id) {
  const p = products.find(p => p.id === id);
  if (p) openAddModal(p);
};

window.deleteProduct = function(id) {
  if (!confirm('Eliminare questo prodotto?')) return;
  products = products.filter(p => p.id !== id);
  save(); render();
};

// ── SEARCH & FILTER ───────────────────────────────────────────────
document.getElementById('search-input').addEventListener('input', e => {
  searchQuery = e.target.value;
  render();
});

document.querySelectorAll('.filter-tab').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    render();
  });
});

// ── EVENTS ───────────────────────────────────────────────────────
document.getElementById('add-btn').addEventListener('click', () => openAddModal());
document.getElementById('close-add-modal').addEventListener('click', closeAddModal);
document.getElementById('cancel-add').addEventListener('click', closeAddModal);
document.getElementById('save-product').addEventListener('click', saveProduct);

// Close modal on overlay click
document.getElementById('add-modal').addEventListener('click', e => { if (e.target === document.getElementById('add-modal')) closeAddModal(); });

// Enter key submit
document.getElementById('add-modal').addEventListener('keydown', e => { if (e.key === 'Enter') saveProduct(); });

// ── BARCODE SCANNER ───────────────────────────────────────────────
let codeReader = null;
let scanStream = null;

async function openScanModal() {
  document.getElementById('scan-modal').classList.remove('hidden');
  document.getElementById('scan-result-area').style.display = 'none';
  document.getElementById('scan-status').textContent = 'Avvio fotocamera…';
  startScanner();
}

async function startScanner() {
  try {
    if (typeof ZXing === 'undefined') {
      document.getElementById('scan-status').textContent = 'Libreria non disponibile. Usa inserimento manuale.';
      return;
    }
    stopScanner();
    codeReader = new ZXing.BrowserMultiFormatReader();
    const video = document.getElementById('scan-video');
    document.getElementById('scan-status').textContent = 'Punta la fotocamera sul codice a barre';
    await codeReader.decodeFromVideoDevice(null, video, (result, err) => {
      if (result) {
        const code = result.getText();
        stopScanner();
        document.getElementById('scan-code-display').value = code;
        document.getElementById('scan-status').textContent = '✅ Codice rilevato!';

        // check if already in db
        const existing = products.find(p => p.barcode === code);
        if (existing) {
          document.getElementById('scan-name').value = existing.name;
          document.getElementById('scan-category').value = existing.category;
        } else {
          document.getElementById('scan-name').value = '';
        }
        document.getElementById('scan-date').value = '';
        document.getElementById('scan-result-area').style.display = 'block';
        setTimeout(() => document.getElementById('scan-name').focus(), 50);
      }
    });
  } catch(e) {
    document.getElementById('scan-status').textContent = 'Impossibile accedere alla fotocamera: ' + e.message;
  }
}

function stopScanner() {
  if (codeReader) { try { codeReader.reset(); } catch(e) {} codeReader = null; }
}

function closeScanModal() {
  stopScanner();
  document.getElementById('scan-modal').classList.add('hidden');
}

document.getElementById('scan-btn').addEventListener('click', openScanModal);
document.getElementById('close-scan-modal').addEventListener('click', closeScanModal);
document.getElementById('scan-modal').addEventListener('click', e => { if (e.target === document.getElementById('scan-modal')) closeScanModal(); });

document.getElementById('scan-retry').addEventListener('click', () => {
  document.getElementById('scan-result-area').style.display = 'none';
  startScanner();
});

document.getElementById('scan-save').addEventListener('click', () => {
  const name     = document.getElementById('scan-name').value.trim();
  const expiry   = document.getElementById('scan-date').value;
  const category = document.getElementById('scan-category').value;
  const barcode  = document.getElementById('scan-code-display').value;
  if (!name || !expiry) { showBanner('warning','Campi mancanti','Inserisci nome e data di scadenza.'); return; }
  products.push({ id: uid(), name, expiry, category, barcode, notes: '', addedOn: new Date().toISOString() });
  save(); closeScanModal(); render();
  showBanner('success','Prodotto aggiunto',`${name} salvato.`);
});

// ── NOTIFICATIONS ─────────────────────────────────────────────────
let notifPermission = Notification.permission;

document.getElementById('notif-btn').addEventListener('click', async () => {
  if (notifPermission === 'granted') {
    checkAndNotify(true);
  } else if (notifPermission !== 'denied') {
    const p = await Notification.requestPermission();
    notifPermission = p;
    if (p === 'granted') {
      document.getElementById('notif-btn').textContent = '🔔';
      checkAndNotify(true);
    }
  } else {
    showBanner('warning','Notifiche bloccate','Abilita le notifiche nelle impostazioni del browser.');
  }
});

function checkAndNotify(force = false) {
  const expired = products.filter(p => daysLeft(p.expiry) <= 0);
  const soon    = products.filter(p => { const d = daysLeft(p.expiry); return d > 0 && d <= 3; });

  if (expired.length > 0) {
    sendNotif('⚠️ Prodotti scaduti', `${expired.length} prodotto/i scaduto/i: ${expired.map(p=>p.name).slice(0,3).join(', ')}`);
  }
  if (soon.length > 0) {
    sendNotif('🕐 In scadenza presto', `${soon.map(p=>p.name+' ('+daysLeft(p.expiry)+'gg)').slice(0,3).join(', ')}`);
  }
  if (force && expired.length === 0 && soon.length === 0) {
    showBanner('success','Tutto fresco!','Nessun prodotto in scadenza nei prossimi 3 giorni.');
  }
}

function sendNotif(title, body) {
  if (notifPermission === 'granted') {
    new Notification(title, { body, icon: '' });
  }
  showBanner('warning', title, body);
}

// ── IN-APP BANNER ─────────────────────────────────────────────────
let bannerTimeout = null;
function showBanner(type, title, msg) {
  const b = document.getElementById('notif-banner');
  const icons = { warning:'⚠️', success:'✅', info:'ℹ️' };
  document.getElementById('notif-banner').querySelector('.notif-icon').textContent = icons[type] || 'ℹ️';
  document.getElementById('notif-title').textContent = title;
  document.getElementById('notif-msg').textContent   = msg;
  b.classList.remove('hidden');
  clearTimeout(bannerTimeout);
  bannerTimeout = setTimeout(() => b.classList.add('hidden'), 5000);
}
document.getElementById('notif-close-btn').addEventListener('click', () => {
  document.getElementById('notif-banner').classList.add('hidden');
});

// ── AUTO CHECK ON LOAD ─────────────────────────────────────────────
// Set today as min date for inputs
const todayStr = new Date().toISOString().split('T')[0];
document.getElementById('input-date').min = todayStr;
document.getElementById('scan-date').min = todayStr;

// Daily check
setTimeout(() => {
  if (notifPermission === 'granted') checkAndNotify();
  else {
    // Just show in-app banner if there are issues
    const urgent = products.filter(p => daysLeft(p.expiry) <= 1);
    if (urgent.length > 0) {
      showBanner('warning', '⚠️ Attenzione', `${urgent.length} prodotto/i in scadenza imminente.`);
    }
  }
}, 1500);

// ── INIT ──────────────────────────────────────────────────────────
if (getActiveProfile() && getProfiles().find(p => p.id === getActiveProfile())) {
  loadApp();
} else {
  showProfileScreen();
}
</script>
